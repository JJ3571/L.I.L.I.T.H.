# Docker Compose
#
# Default Postgres is bundled via the Compose profile `bundled-db`
# (see `.env.example` `COMPOSE_PROFILES`):
#   • bundled-db  → postgres:17-alpine on discord_bot_net. The bot default
#                   DATABASE_URL targets host `postgres`.
#   • admin-ui    → pgAdmin on http://127.0.0.1:${PGADMIN_HOST_PORT:-5050}
#                   (requires bundled-db for DB host `postgres`).
# Clear COMPOSE_PROFILES (remove bundled-db) when you use an external
# Postgres URL. Set DATABASE_URL in `.env` for that case.
#
# Entry point (recommended):
#   ./scripts/bot.sh up
#
# Cloned-repo local image build (for developing):
#   ./scripts/docker_compose_up.sh     # prepare staging if missing; --env default
#   ./scripts/local_docker_deploy.sh   # compose down then docker_compose_up
#
# Optional Doppler: pass --doppler to the scripts above. See docs/SECRETS_DOPPLER.md.
#
services:
  bot:
    image: ghcr.io/jj3571/discord-bot:latest
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      lavalink:
        condition: service_started
    networks:
      - discord_bot_net
    volumes:
      # Local audio assets (music, brainrot sfx)
      - ./local_audio:/app/local_audio:ro
      # Persisted data (tierlist images, etc.. These survive image rebuilds.)
      - tierlist_data:/app/data
      # Combined runtime log
      - ./logs:/app/logs
    restart: unless-stopped
    # The whole host `.env` is the bot process environment. Lines below replace
    # values that are wrong inside the container (host Python keeps the .env values).
    env_file:
      - .env
    environment:
      # Empty DATABASE_URL means bundled Postgres on the Compose network.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-discord_bot}?sslmode=disable}
      # Host `.env` often has http://127.0.0.1:2333. That address is the bot
      # container itself. Set LAVALINK_DOCKER_URI only for Lavalink outside Compose.
      LAVALINK_URI: ${LAVALINK_DOCKER_URI:-http://lavalink:2333}
      MUSIC_LOCAL_HTTP_HOST: bot
      MUSIC_LOCAL_HTTP_BIND_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  lavalink:
    # Pre-built official image. Mount application.yml to override defaults
    image: ghcr.io/lavalink-devs/lavalink:latest
    networks:
      - discord_bot_net
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - YOUTUBE_OAUTH_ENABLED=${YOUTUBE_OAUTH_ENABLED:-false}
      - YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
    volumes:
      # Official image reads config here — https://lavalink.dev/getting-started/docker
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./logs:/opt/Lavalink/logs
    ports:
      - "127.0.0.1:2333:2333"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: $$LAVALINK_PASSWORD\" http://localhost:2333/v4/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    profiles:
      - bundled-db
    networks:
      - discord_bot_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-discord_bot}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional web UI for Postgres. Enable with COMPOSE_PROFILES=bundled-db,admin-ui — requires bundled-db.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - admin-ui
    networks:
      - discord_bot_net
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  # Named volumes survive container rebuilds — only image changes, data persists.
  tierlist_data:
  pg_data:
  pgadmin_data:

networks:
  # Explicit bridge so bot resolves `lavalink` via Compose DNS over the internal net (see LAVALINK_URI above).
  discord_bot_net:
    driver: bridge
